repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [ --fix, --exit-zero ]

  - repo: https://github.com/ugliestie/openglypa_hooks
    rev: v0.0.1
    hooks:
      - id: check-memes
