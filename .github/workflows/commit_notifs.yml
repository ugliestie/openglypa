name: telegram message notification
on:
  issues:
    types: [opened, reopened, deleted, closed]
  push:
  pull_request:
    types:
      [
        assigned,
        opened,
        closed,
        reopened,
        edited,
        review_requested,
        review_request_removed,
        ready_for_review,
      ]
  issue_comment:
  pull_request_review:
  pull_request_review_comment:

jobs:
  send-tele:
    uses: ugliestie/github-notifs-telebot/.github/workflows/main.yml@main
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}