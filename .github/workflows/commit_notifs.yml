name: Уведомления о коммитах

on: push

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Отправить сообщение
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          MESSAGE="👀 new commit by ${{ github.event.head_commit.author.name }}/n/n${{ github.event.head_commit.url }}/n<a href=""></a>"
          curl -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d "chat_id=$CHANNEL_ID&text=$MESSAGE&parse_mode=HTML"